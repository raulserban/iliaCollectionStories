name: Publish daily story

on:
  schedule:
    # Main run 17:37 Bucharest (winter, UTC+2). GitHub sometimes starts cron runs late,
    # so there are extra runs every 30 min. The first one that runs posts; the rest skip.
    # publish.py posts the oldest item whose date + time has already passed:
    # a late run (even after midnight) posts late, never a day early.
    - cron: "37 15 * * *"
    - cron: "7 16 * * *"
    - cron: "37 16 * * *"
    - cron: "7 17 * * *"
    - cron: "37 17 * * *"
  workflow_dispatch:
    inputs:
      story_number:
        description: "Story number to publish (leave empty = today's story)"
        required: false
        default: ""
      dry_run:
        description: "Test only (create containers, do NOT publish)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Publish to Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: "17841424464874525"
          STORY_NUMBER: ${{ github.event.inputs.story_number }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
        run: python3 publish.py

      - name: Save posting log
        run: |
          if [ -n "$(git status --porcelain posted.json)" ]; then
            git config user.name "iliaCollections bot"
            git config user.email "actions@github.com"
            git add posted.json
            git commit -m "Posted story $(python3 -c 'import json;print(max(json.load(open("posted.json"))))')"
            git push
          fi
